<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const result = document.querySelector('#result');
                const correctId = 'jupiterButton';

                document.querySelectorAll('#part1 button').forEach(button => {
                    button.addEventListener('click', function () {
                        document.querySelectorAll('#part1 button').forEach(btn => btn.style.backgroundColor = '');

                        if (this.id === correctId) {
                            this.style.backgroundColor = 'green';
                            result.textContent = 'Correct!';
                        } else {
                            this.style.backgroundColor = 'red';
                            result.textContent = 'Incorrect';
                        }
                    });
                });

                const answer = document.querySelector('#answer');
                const input = document.querySelector('#part2 #userInput');
                const correctAnswer = 'leonardo da vinci';

                document.querySelector('#part2 #SubmitButton').addEventListener('click', function(){
                event.preventDefault();

                    if(input.value.toLowerCase() == correctAnswer)
                    {
                        input.style.backgroundColor = 'green';
                        answer.textContent = 'Correct!';
                    }
                    else
                    {
                        input.style.backgroundColor = 'red';
                        answer.textContent = 'Incorrect!';
                    }

                });
            });

        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div id="part1" class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <h3>What is the largest planet in our solar system? </h3>
                <button id="mercuryButton">Mercury</button>
                <button id="earthButton">Earth</button>
                <button id="jupiterButton">Jupiter</button>
                <button id="marsButton">Mars</button>
                <p id="result"></p>
            </div>

            <div id="part2" class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <h3>Who painted the Mona Lisa? </h3>
                    <input id="userInput" placeholder="Your answer">
                    <button id="SubmitButton">Check Answer</button>
                    <p id="answer"></p>
            </div>
        </div>
    </body>
</html>
